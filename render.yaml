# Render Blueprint (https://render.com/docs/blueprint-spec) for the FastAPI
# backend. In the Render dashboard: New -> Blueprint -> connect this repo ->
# Render reads this file and provisions the service below. Env vars marked
# `sync: false` are prompted for during setup rather than stored here, since
# they're secrets/environment-specific values (see docs/deployment.md).
services:
  - type: web
    name: thinkfin-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # alembic.ini's script_location is `%(here)s/../database/migrations`,
    # resolved relative to alembic.ini itself (not the working directory),
    # so this works regardless of rootDir.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_NAME
        value: ThinkFin Research Engine
      - key: ENVIRONMENT
        value: production

  # Monthly worker: fetches AMC portfolio-disclosure Excel files and
  # stores them in Google Drive (see portfolio-fetcher/README.md).
  # Render's Cron Job type requires a paid plan — free-tier web services
  # can't run on a schedule — so this is provisioned separately in the
  # dashboard (New -> Cron Job, currently crn-daknidgu01pc73fpekbg)
  # rather than picked up by the Blueprint, which only auto-provisions
  # `type: web`/`worker` services. Kept here for reference and so
  # `render.yaml` documents the real schedule/env vars/runtime the
  # existing Cron Job should be updated to match — this file alone does
  # NOT change the live service; see README.md for the dashboard steps.
  #
  # Docker, not the plain Python runtime: tier2 scrapers
  # (scrapers/tier2_playwright.py) need a real Chromium install via
  # Playwright, which only a Dockerfile-based build can provide system
  # dependencies for (see Dockerfile).
  - type: cron
    name: thinkfin-portfolio-fetcher
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    rootDir: portfolio-fetcher
    schedule: "30 20 10 * *" # 02:00 AM IST (UTC+5:30) on the 11th of every month
    envVars:
      # Primary auth path — see drive_manager.py's module docstring for
      # why OAuth2 user credentials are now preferred over the
      # service-account fallback below.
      - key: GOOGLE_OAUTH_TOKEN_B64
        sync: false
      # Fallback auth path — only works if DRIVE_MONTHLY_PORTFOLIOS_PARENT_ID
      # actually lives inside a Google Shared Drive (see README.md).
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DRIVE_MASTER_DB_FOLDER_ID
        value: "1hSNV629OnGOchyP0coX72lVA7-Eg1kAx"
      - key: DRIVE_MONTHLY_PORTFOLIOS_PARENT_ID
        value: "1acNwjxV2mJnEZ9BDAlKoDZpZTVav9h_5"
      - key: CATALOG_SPREADSHEET_ID
        value: "1sSIAhoPCMHYQH6K5kF9oOZwAp7Llbyrr8d9Db0-YCFU"
      - key: HEADLESS
        value: "true"

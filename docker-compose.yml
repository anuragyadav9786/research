services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-thinkfin}
    ports:
      - "5432:5432"
    volumes:
      - thinkfin_pgdata:/var/lib/postgresql/data

volumes:
  thinkfin_pgdata:

name: Daily NAV Ingestion

# Scheduled and live: DATABASE_URL (a Supabase Session Pooler connection
# string — the direct-connection host is IPv6-only and unreachable from
# GitHub-hosted runners) is set as a repository secret, and a manual
# workflow_dispatch run has been verified end-to-end against real
# infrastructure: migrations applied against the live Supabase database,
# and the NAV ingestion step successfully fetched and parsed real AMFI
# data (downloaded=14361). AMFI IS reachable from GitHub-hosted runners —
# this dev sandbox's own inability to reach amfiindia.com (see
# docs/data-sources.md) does not apply there.
#
# That run's records_accepted was 0 (all 14361 rejected) — expected, not
# a bug: this database only holds the fictional Phase 2 sample funds (see
# database/seeds/seed_sample_data.py), whose scheme codes don't match any
# real AMFI scheme, so every real record is correctly rejected as
# unmatched. Real, matching data will start flowing once real fund
# schemes are loaded into this database.

on:
  workflow_dispatch:
    inputs:
      debug_sample:
        description: "Print a raw sample of the fetched AMFI file and exit, without touching the database"
        type: boolean
        default: false
      debug_check_deploy:
        description: "Check the live DB's current alembic revision/schema and the Render health endpoint, without running migrations or ingestion"
        type: boolean
        default: false
      run_cleanup_bulk_backfill:
        description: "DESTRUCTIVE: delete nav_history rows sourced from the superseded bulk AMFI historical backfill (see git history), then VACUUM FULL to actually reclaim disk space. One-time cleanup for the Supabase free-tier quota this caused."
        type: boolean
        default: false
      debug_idcw_scope:
        description: "Read-only: report how many scheme_variants/schemes are IDCW-only vs growth, to scope removing IDCW support"
        type: boolean
        default: false
      run_cleanup_idcw:
        description: "DESTRUCTIVE: delete all IDCW-option scheme_variants (and their nav_history), plus any scheme left with zero variants as a result. Growth-only going forward per user request."
        type: boolean
        default: false
      debug_portfolio_disclosure:
        description: "Read-only: fetch AMFI's monthly portfolio-disclosure page and print what's actually there (file links, API hints, raw HTML sample) — no DB writes, no files saved. Scoping a future on-demand (not stored) holdings lookup."
        type: boolean
        default: false
      backfill_featured_funds:
        description: "Writes real data: resolves a curated list of well-known funds to real scheme_variant ids, then calls the live backend's nav-history endpoint for each — triggering the existing Phase 15 mfapi.in lazy backfill deliberately, instead of waiting for organic traffic. Safe to re-run (the backfill it triggers is itself idempotent)."
        type: boolean
        default: false
      debug_ppfas_disclosure:
        description: "Read-only: fetch PPFAS's own portfolio-disclosure page (AMFI links out to it, not a central API) and print what's actually there — no DB writes, no files saved. Feasibility pilot for real per-AMC holdings ingestion."
        type: boolean
        default: false
  schedule:
    - cron: "30 0 * * *"  # ~06:00 IST daily; AMFI publishes NAV once per business day

jobs:
  ingest:
    runs-on: ubuntu-latest
    # `secrets` is not a recognized named-value inside `if:` conditions —
    # GitHub Actions only exposes it directly in `run:`/`env:`. Routing it
    # through job-level `env` here lets the "is it configured" check below
    # use `env.DATABASE_URL` instead (this was only caught by actually
    # triggering the workflow, not by review — GitHub's own workflow
    # parser rejects the direct `secrets.DATABASE_URL` form at dispatch time).
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check DATABASE_URL is configured
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "::error::DATABASE_URL repository secret is not set. See docs/deployment.md — a real, persistent Postgres instance must be provisioned and its connection string added as a secret before this workflow can run."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Debug — print raw AMFI file sample (no DB writes)
        if: ${{ inputs.debug_sample == true }}
        run: |
          python -c "
          from data_pipeline.sources.amfi.client import fetch_navall
          text = fetch_navall()
          lines = text.splitlines()
          print(f'total lines: {len(lines)}')
          for line in lines[:40]:
              print(repr(line))
          "

      - name: Debug — check live DB schema/revision and Render health (no writes)
        if: ${{ inputs.debug_check_deploy == true }}
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, os.path.join(os.getcwd(), 'backend'))
          import httpx
          from sqlalchemy import inspect, text
          from app.core.database import engine

          with engine.connect() as conn:
              rev = conn.execute(text('SELECT version_num FROM alembic_version')).scalar()
              print(f'alembic_version in live DB: {rev!r}')
              cols = [c['name'] for c in inspect(engine).get_columns('scheme_variants')]
              print(f'nav_history_backfilled_at column present: {\"nav_history_backfilled_at\" in cols}')

              print()
              print('-- database size --')
              size = conn.execute(text('SELECT pg_size_pretty(pg_database_size(current_database()))')).scalar()
              print(f'total database size: {size}')

              print()
              print('-- table sizes (top 10) --')
              rows = conn.execute(text('''
                  SELECT relname, pg_size_pretty(pg_total_relation_size(relid)) AS total_size,
                         pg_total_relation_size(relid) AS bytes
                  FROM pg_catalog.pg_statio_user_tables
                  ORDER BY bytes DESC LIMIT 10
              ''')).all()
              for r in rows:
                  print(f'  {r.relname}: {r.total_size}')

              print()
              print('-- nav_history row counts by source --')
              rows = conn.execute(text('''
                  SELECT ds.name, ds.source_type, count(*) AS rows
                  FROM nav_history nh JOIN data_sources ds ON ds.id = nh.source_id
                  GROUP BY ds.name, ds.source_type ORDER BY rows DESC
              ''')).all()
              for r in rows:
                  print(f'  {r.name!r} ({r.source_type}): {r.rows} rows')

          try:
              resp = httpx.get('https://thinkfin-backend.onrender.com/api/health', timeout=15.0)
              print(f'Render health: HTTP {resp.status_code} body={resp.text}')
          except Exception as exc:
              print(f'Render health check FAILED: {type(exc).__name__}: {exc}')
          "

      - name: Cleanup — delete superseded bulk-backfill NAV rows and reclaim disk space
        if: ${{ inputs.run_cleanup_bulk_backfill == true }}
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, os.path.join(os.getcwd(), 'backend'))
          from sqlalchemy import text
          from app.core.database import engine

          SOURCE_NAME = 'AMFI Historical NAV Report (backfill)'

          with engine.connect() as conn:
              before = conn.execute(text('SELECT pg_size_pretty(pg_database_size(current_database()))')).scalar()
              print(f'database size before: {before}')

              source_id = conn.execute(
                  text('SELECT id FROM data_sources WHERE name = :name'), {'name': SOURCE_NAME}
              ).scalar()
              if source_id is None:
                  print(f'No data_sources row named {SOURCE_NAME!r} — nothing to delete.')
              else:
                  result = conn.execute(
                      text('DELETE FROM nav_history WHERE source_id = :sid'), {'sid': source_id}
                  )
                  conn.commit()
                  print(f'Deleted {result.rowcount} nav_history rows from source_id={source_id} ({SOURCE_NAME!r})')

              print('Running VACUUM FULL nav_history to actually shrink the table on disk (a bare DELETE only marks space reusable, it does not release it back to the OS — Supabase reports physical size)...')

          # VACUUM cannot run inside a multi-statement transaction block —
          # needs its own autocommit connection.
          with engine.connect().execution_options(isolation_level='AUTOCOMMIT') as conn:
              conn.execute(text('VACUUM FULL nav_history'))

          with engine.connect() as conn:
              after = conn.execute(text('SELECT pg_size_pretty(pg_database_size(current_database()))')).scalar()
              nav_size = conn.execute(
                  text(\"SELECT pg_size_pretty(pg_total_relation_size('nav_history'))\")
              ).scalar()
              remaining = conn.execute(text('SELECT count(*) FROM nav_history')).scalar()
              print(f'database size after: {after}')
              print(f'nav_history table size after: {nav_size}')
              print(f'nav_history rows remaining: {remaining}')
          "

      - name: Debug — scope IDCW variants/schemes (no writes)
        if: ${{ inputs.debug_idcw_scope == true }}
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, os.path.join(os.getcwd(), 'backend'))
          from sqlalchemy import text
          from app.core.database import engine

          with engine.connect() as conn:
              rows = conn.execute(text('SELECT option, count(*) FROM scheme_variants GROUP BY option')).all()
              print('scheme_variants by option:', dict(rows))

              nav_by_option = conn.execute(text('''
                  SELECT sv.option, count(*) FROM nav_history nh
                  JOIN scheme_variants sv ON sv.id = nh.scheme_variant_id
                  GROUP BY sv.option
              ''')).all()
              print('nav_history rows by variant option:', dict(nav_by_option))

              metrics_by_option = conn.execute(text('''
                  SELECT sv.option, count(*) FROM fund_metrics fm
                  JOIN scheme_variants sv ON sv.id = fm.scheme_variant_id
                  GROUP BY sv.option
              ''')).all()
              print('fund_metrics rows by variant option:', dict(metrics_by_option))

              orphaned = conn.execute(text('''
                  SELECT count(*) FROM schemes s
                  WHERE NOT EXISTS (
                      SELECT 1 FROM scheme_variants sv WHERE sv.scheme_id = s.id AND sv.option = 'growth'
                  )
              ''')).scalar()
              total_schemes = conn.execute(text('SELECT count(*) FROM schemes')).scalar()
              print(f'schemes with NO growth variant at all (would be orphaned): {orphaned} of {total_schemes} total schemes')
          "

      - name: Cleanup — delete IDCW-option variants, their NAV history, and any now-empty schemes
        if: ${{ inputs.run_cleanup_idcw == true }}
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, os.path.join(os.getcwd(), 'backend'))
          from sqlalchemy import text
          from app.core.database import engine

          with engine.connect() as conn:
              nav_deleted = conn.execute(text('''
                  DELETE FROM nav_history WHERE scheme_variant_id IN (
                      SELECT id FROM scheme_variants WHERE option = 'idcw'
                  )
              ''')).rowcount
              print(f'Deleted {nav_deleted} nav_history rows for IDCW variants')

              variants_deleted = conn.execute(text(\"DELETE FROM scheme_variants WHERE option = 'idcw'\")).rowcount
              print(f'Deleted {variants_deleted} IDCW scheme_variants')

              schemes_deleted = conn.execute(text('''
                  DELETE FROM schemes s WHERE NOT EXISTS (
                      SELECT 1 FROM scheme_variants sv WHERE sv.scheme_id = s.id
                  )
              ''')).rowcount
              print(f'Deleted {schemes_deleted} schemes left with zero variants (growth-only, never offered growth)')

              conn.commit()

          with engine.connect().execution_options(isolation_level='AUTOCOMMIT') as conn:
              for tbl in ('nav_history', 'scheme_variants', 'schemes'):
                  conn.execute(text(f'VACUUM FULL {tbl}'))

          with engine.connect() as conn:
              size = conn.execute(text('SELECT pg_size_pretty(pg_database_size(current_database()))')).scalar()
              remaining_variants = conn.execute(text(\"SELECT count(*) FROM scheme_variants\")).scalar()
              remaining_options = dict(conn.execute(text('SELECT option, count(*) FROM scheme_variants GROUP BY option')).all())
              remaining_schemes = conn.execute(text('SELECT count(*) FROM schemes')).scalar()
              print(f'database size after: {size}')
              print(f'scheme_variants remaining: {remaining_variants} {remaining_options}')
              print(f'schemes remaining: {remaining_schemes}')
          "

      - name: Debug — inspect AMFI's monthly portfolio-disclosure page (no DB writes, no files saved)
        if: ${{ inputs.debug_portfolio_disclosure == true }}
        run: |
          python3 << 'PYEOF'
          import re
          import httpx

          # Distinct from download-factsheets (the one-page performance/AUM
          # summary) — this is AMFI's page for the complete, security-level
          # monthly holdings disclosure (see docs/data-sources.md once this
          # investigation lands there). Read-only: prints what's actually
          # on the page so a real pipeline can be built against confirmed
          # structure, not a guess — same reasoning as debug_sample earlier
          # in this file for the AMFI NAV feed. Uses a heredoc (not
          # python -c "...") specifically so this script's own quote marks
          # never have to be escaped for the surrounding shell.
          PAGE_URL = "https://www.amfiindia.com/online-center/portfolio-disclosure"

          try:
              resp = httpx.get(PAGE_URL, timeout=30.0, follow_redirects=True)
          except Exception as exc:
              print(f"page fetch FAILED: {type(exc).__name__}: {exc}")
              raise SystemExit(1)
          print(f"status: {resp.status_code}")
          text = resp.text
          print(f"page length: {len(text)} chars")
          print()

          file_links = sorted(set(re.findall(
              r"""href=["']([^"']+\.(?:xlsx|xls|csv|zip))["']""", text, re.IGNORECASE
          )))
          print(f"-- direct file links found: {len(file_links)} --")
          for link in file_links[:25]:
              print(f"  {link}")
          print()

          api_hints = sorted(set(re.findall(
              r"""["']([^"']*(?:api|ajax|getportfolio|handler|\.aspx)[^"']*)["']""", text, re.IGNORECASE
          )))
          print(f"-- possible API/AJAX/handler hints found: {len(api_hints)} --")
          for hint in api_hints[:25]:
              print(f"  {hint}")
          print()

          print("-- raw HTML sample (first 3000 chars) --")
          print(text[:3000])

          if file_links:
              first = file_links[0]
              if first.startswith("http"):
                  file_url = first
              elif first.startswith("/"):
                  file_url = f"https://www.amfiindia.com{first}"
              else:
                  file_url = f"https://www.amfiindia.com/{first}"
              print()
              print(f"-- attempting to fetch first discovered file: {file_url} --")
              try:
                  file_resp = httpx.get(file_url, timeout=30.0, follow_redirects=True)
                  content_type = file_resp.headers.get("content-type", "unknown")
                  print(f"status: {file_resp.status_code}, content-type: {content_type}, bytes: {len(file_resp.content)}")
                  if file_url.lower().endswith((".xlsx", ".xls")):
                      try:
                          import io
                          import pandas as pd
                          sheets = pd.read_excel(io.BytesIO(file_resp.content), sheet_name=None, nrows=5)
                          print(f"sheet names: {list(sheets.keys())[:10]}")
                          first_sheet_name = next(iter(sheets))
                          print(f"first sheet ({first_sheet_name!r}) columns: {list(sheets[first_sheet_name].columns)}")
                          print(sheets[first_sheet_name].head())
                      except ImportError as exc:
                          print(f"pandas Excel engine not available in this env ({exc}) — file fetched fine, structure unread this run")
              except Exception as exc:
                  print(f"file fetch FAILED: {type(exc).__name__}: {exc}")
          else:
              print()
              print("No direct file links found in the raw HTML — the AMC/file picker is likely JS-rendered client-side rather than server-rendered. The API/handler hints above are the next thing to check by hand.")

          # The page-specific JS chunk (fetched below) revealed the real
          # mechanism: a React component that receives a `members` prop —
          # a list of per-AMC objects with mf_id, mf_name, icons, and
          # per-frequency disclosure fields (e.g.
          # amc_monthly_portfolio_disclosure) whose value is a URL opened
          # directly (window.open). So this isn't one central API —
          # AMFI just links out to each AMC's own site. In Next.js App
          # Router that `members` data is server-fetched and embedded in
          # the page's own HTML as RSC flight data, not a separate
          # AJAX call — so it should already be inside `text` above.
          # Search for it directly, and specifically for the 3 real AMCs
          # this platform already has featured funds from, to get their
          # real disclosure links without guessing.
          print()
          print("-- searching the already-fetched page HTML for embedded member/AMC data --")
          mf_name_hits = [m.start() for m in re.finditer(r"mf_name", text)]
          print(f"'mf_name' occurrences in page HTML: {len(mf_name_hits)}")
          for pos in mf_name_hits[:5]:
              print(f"  ...{text[max(0, pos - 80):pos + 200]}...")

          print()
          TARGET_AMC_HINTS = ["PPFAS", "Parag Parikh", "Mirae Asset", "quant Money", "Quant Mutual", "quant Mutual"]
          for hint in TARGET_AMC_HINTS:
              idx = text.lower().find(hint.lower())
              if idx == -1:
                  print(f"'{hint}': not found in page HTML")
              else:
                  print(f"'{hint}': found at offset {idx}")
                  print(f"  ...{text[max(0, idx - 150):idx + 500]}...")

          # Resuming the parked investigation: the file picker is client-
          # rendered, so the real download/API endpoint is only visible
          # inside the page's own JS bundles, not the server-rendered
          # HTML above. Find every JS file the page references, fetch a
          # bounded number of them, and grep each for endpoint-shaped
          # string literals (a path or URL containing a word like "api",
          # "ajax", "handler", or "portfolio").
          js_files = sorted(set(re.findall(
              r"""src=["']([^"']+\.js)["']""", text, re.IGNORECASE
          )))
          print()
          print(f"-- JS bundle files referenced in the page: {len(js_files)} --")
          for js in js_files[:40]:
              print(f"  {js}")

          endpoint_pattern = re.compile(
              r"""["'`]((?:https?:)?//[^"'`]{0,200}(?:api|ajax|handler|getportfolio|portfolio|holdings|scheme|amc|disclosure|download|export)[^"'`]{0,200}|/[A-Za-z0-9_.\/-]{0,200}(?:api|ajax|handler|getportfolio|portfolio|holdings|scheme|amc|disclosure|download|export)[A-Za-z0-9_.\/-]{0,200})["'`]""",
              re.IGNORECASE,
          )

          # The page's own chunk (path contains "portfolio-disclosure") is
          # where its actual fetch/download logic lives — everything else
          # is shared framework/vendor code. Fetch that one first so it's
          # never pushed out by the fetch cap below.
          priority_files = [f for f in js_files if "portfolio-disclosure" in f.lower()]
          other_files = [f for f in js_files if f not in priority_files]
          ordered_files = priority_files + other_files
          print()
          print(f"-- page-specific chunk(s) prioritized: {priority_files} --")

          # The priority chunk's full content already printed everything
          # needed once found — limit this run to just that, to keep the
          # log focused instead of re-printing the ~15 generic chunks
          # already confirmed empty of endpoint hints in the prior run.
          MAX_JS_FETCHES = len(priority_files) if priority_files else 15
          for js in ordered_files[:MAX_JS_FETCHES]:
              if js.startswith("http"):
                  js_url = js
              elif js.startswith("//"):
                  js_url = f"https:{js}"
              elif js.startswith("/"):
                  js_url = f"https://www.amfiindia.com{js}"
              else:
                  js_url = f"https://www.amfiindia.com/{js}"
              print()
              print(f"-- fetching JS bundle: {js_url} --")
              try:
                  js_resp = httpx.get(js_url, timeout=30.0, follow_redirects=True)
                  js_text = js_resp.text
                  print(f"status: {js_resp.status_code}, bytes: {len(js_resp.content)}")
                  matches = sorted(set(endpoint_pattern.findall(js_text)))
                  print(f"  endpoint-like strings found: {len(matches)}")
                  for m in matches[:20]:
                      print(f"    {m}")
                  # Regex can miss a dynamically-built endpoint (string
                  # concatenation, a template literal, a bare path with no
                  # matched keyword) — for the page-specific chunk, also
                  # dump a raw sample so it can be read by eye.
                  if js in priority_files:
                      print(f"  -- FULL raw content of this page-specific chunk ({len(js_text)} chars) --")
                      print(f"    {js_text}")
              except Exception as exc:
                  print(f"  fetch FAILED: {type(exc).__name__}: {exc}")

          if len(js_files) > MAX_JS_FETCHES:
              print()
              print(f"-- {len(js_files) - MAX_JS_FETCHES} additional JS file(s) not fetched this run (capped at {MAX_JS_FETCHES}) --")
          PYEOF

      - name: Debug — inspect PPFAS's own portfolio-disclosure page (no DB writes, no files saved)
        if: ${{ inputs.debug_ppfas_disclosure == true }}
        run: |
          python3 << 'PYEOF'
          import re
          import httpx

          # Feasibility pilot for real per-AMC holdings ingestion. AMFI's
          # own portfolio-disclosure page turned out to be a directory
          # that links out to each AMC's own site (confirmed via its own
          # embedded data — see the debug_portfolio_disclosure step run
          # history), not a central API. PPFAS is the AMC for Parag
          # Parikh Flexi Cap, one of this platform's 3 real featured
          # funds, and its real disclosure link (found in that same run)
          # is this one. Read-only: prints what's actually there so a
          # real ingestion pipeline can be built against confirmed
          # structure, not a guess.
          PAGE_URL = "https://amc.ppfas.com/downloads/portfolio-disclosure/"

          try:
              resp = httpx.get(PAGE_URL, timeout=30.0, follow_redirects=True)
          except Exception as exc:
              print(f"page fetch FAILED: {type(exc).__name__}: {exc}")
              raise SystemExit(1)
          print(f"status: {resp.status_code}")
          text = resp.text
          print(f"page length: {len(text)} chars")
          print()

          file_links = sorted(set(re.findall(
              r"""href=["']([^"']+\.(?:xlsx|xls|csv|zip|pdf))["']""", text, re.IGNORECASE
          )))
          print(f"-- direct file links found: {len(file_links)} --")
          for link in file_links[:25]:
              print(f"  {link}")
          print()

          js_files = sorted(set(re.findall(
              r"""src=["']([^"']+\.js)["']""", text, re.IGNORECASE
          )))
          print(f"-- JS bundle files referenced in the page: {len(js_files)} --")
          for js in js_files[:25]:
              print(f"  {js}")
          print()

          print("-- raw HTML sample (first 3000 chars) --")
          print(text[:3000])

          if file_links:
              first = file_links[0]
              if first.startswith("http"):
                  file_url = first
              elif first.startswith("/"):
                  file_url = f"https://amc.ppfas.com{first}"
              else:
                  file_url = f"https://amc.ppfas.com/{first}"
              print()
              print(f"-- attempting to fetch first discovered file: {file_url} --")
              try:
                  file_resp = httpx.get(file_url, timeout=30.0, follow_redirects=True)
                  content_type = file_resp.headers.get("content-type", "unknown")
                  print(f"status: {file_resp.status_code}, content-type: {content_type}, bytes: {len(file_resp.content)}")
                  if file_url.lower().endswith((".xlsx", ".xls")):
                      try:
                          import io
                          import pandas as pd
                          sheets = pd.read_excel(io.BytesIO(file_resp.content), sheet_name=None, nrows=10)
                          print(f"sheet names: {list(sheets.keys())[:10]}")
                          first_sheet_name = next(iter(sheets))
                          print(f"first sheet ({first_sheet_name!r}) columns: {list(sheets[first_sheet_name].columns)}")
                          print(sheets[first_sheet_name].head(10))
                      except ImportError as exc:
                          print(f"pandas Excel engine not available in this env ({exc}) — file fetched fine, structure unread this run")
              except Exception as exc:
                  print(f"file fetch FAILED: {type(exc).__name__}: {exc}")
          else:
              print()
              print("No direct file links found in the raw HTML — likely JS-rendered client-side, same pattern as AMFI's own page. The JS bundle list above is the next thing to check.")
          PYEOF

      - name: Backfill real NAV history for a curated set of featured funds
        if: ${{ inputs.backfill_featured_funds == true }}
        run: |
          python3 << 'PYEOF'
          import sys, os
          sys.path.insert(0, os.path.join(os.getcwd(), "backend"))
          import httpx
          from sqlalchemy import text
          from app.core.database import engine

          # Real, well-known funds spanning the market-cap spectrum, chosen
          # for the homepage's featured/quick-probe funds and Reality Check
          # widget — not the whole 1,830-fund universe. Deliberately
          # triggering Phase 15's mfapi.in lazy backfill for exactly these
          # now, rather than waiting for organic traffic to open each page
          # first (see ensure_nav_history / _resolve_variant).
          CANDIDATE_NAMES = [
              "Parag Parikh Flexi Cap Fund",
              "Mirae Asset Large Cap Fund",
              "HDFC Mid-Cap Opportunities Fund",
              "Quant Small Cap Fund",
              # Broad-market passive index fund — used as the homepage's
              # real "vs Benchmark" comparison. An index fund's growth-plan
              # NAV reflects dividends reinvested (unlike a raw price
              # index), and — critically — it's just another real mutual
              # fund scheme in this same AMFI feed, so no new data pipeline
              # is needed to get a genuine benchmark comparison. A prior run
              # of this step (broad "Nifty 50/500 Index Fund" substrings)
              # found several real candidates; picked this one specifically
              # because it's a plain index fund (others matched were ELSS
              # tax-saver variants of the same index, which still track it
              # but are an odd thing to label "the benchmark").
              "Axis Nifty 50 Index Fund",
          ]
          BACKEND_URL = "https://thinkfin-backend.onrender.com"

          matches = {}
          with engine.connect() as conn:
              for name in CANDIDATE_NAMES:
                  rows = conn.execute(
                      text("""
                          SELECT s.id AS scheme_id, s.name, sv.id AS variant_id
                          FROM schemes s
                          JOIN scheme_variants sv ON sv.scheme_id = s.id
                          WHERE s.name ILIKE :pattern AND sv.plan = 'direct' AND sv.option = 'growth'
                          LIMIT 3
                      """),
                      {"pattern": f"%{name}%"},
                  ).all()
                  print(f"search {name!r}: {len(rows)} match(es)")
                  for r in rows:
                      print(f"  scheme_id={r.scheme_id} name={r.name!r} variant_id={r.variant_id}")
                  if rows:
                      matches[name] = rows[0]

          print()
          print("-- triggering live backfill via the production API (calls ensure_nav_history) --")
          for name, row in matches.items():
              url = f"{BACKEND_URL}/api/funds/{row.scheme_id}/nav-history"
              try:
                  resp = httpx.get(url, params={"plan": "direct", "option": "growth"}, timeout=90.0)
                  print(f"{name}: HTTP {resp.status_code} ({url})")
              except Exception as exc:
                  print(f"{name}: FAILED {type(exc).__name__}: {exc}")

          print()
          print("-- resulting real NAV history depth --")
          with engine.connect() as conn:
              for name, row in matches.items():
                  depth = conn.execute(
                      text("""
                          SELECT count(*) AS rows, min(date) AS earliest, max(date) AS latest
                          FROM nav_history WHERE scheme_variant_id = :vid
                      """),
                      {"vid": row.variant_id},
                  ).first()
                  print(f"{name}: rows={depth.rows} earliest={depth.earliest} latest={depth.latest}")

          not_found = [n for n in CANDIDATE_NAMES if n not in matches]
          if not_found:
              print()
              print(f"-- not found in database, needs a name adjustment: {not_found} --")

          print()
          print("-- real computed returns / rolling returns / drawdown for the Reality Check widget --")
          for name, row in matches.items():
              print(f"\n{name} (scheme_id={row.scheme_id}):")
              for path, params in [
                  ("returns", {}),
                  ("rolling-returns", {"window_years": 3}),
                  ("drawdown", {}),
              ]:
                  url = f"{BACKEND_URL}/api/funds/{row.scheme_id}/{path}"
                  try:
                      resp = httpx.get(url, params={"plan": "direct", "option": "growth", **params}, timeout=60.0)
                      print(f"  /{path}: HTTP {resp.status_code}")
                      print(f"    {resp.json()}")
                  except Exception as exc:
                      print(f"  /{path}: FAILED {type(exc).__name__}: {exc}")
          PYEOF

      - name: Run database migrations
        if: ${{ inputs.debug_sample != true && inputs.debug_check_deploy != true && inputs.run_cleanup_bulk_backfill != true && inputs.debug_idcw_scope != true && inputs.run_cleanup_idcw != true && inputs.debug_portfolio_disclosure != true && inputs.backfill_featured_funds != true && inputs.debug_ppfas_disclosure != true }}
        working-directory: backend
        run: alembic upgrade head

      - name: Run NAV ingestion
        if: ${{ inputs.debug_sample != true && inputs.debug_check_deploy != true && inputs.run_cleanup_bulk_backfill != true && inputs.debug_idcw_scope != true && inputs.run_cleanup_idcw != true && inputs.debug_portfolio_disclosure != true && inputs.backfill_featured_funds != true && inputs.debug_ppfas_disclosure != true }}
        run: python -m data_pipeline.orchestration.daily_pipeline

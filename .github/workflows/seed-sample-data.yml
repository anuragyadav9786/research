name: Seed Sample Data

# Manual only. Reuses the DATABASE_URL secret already configured for
# daily-nav-ingestion.yml to load the fictional Phase 2 sample data
# (database/seeds/seed_sample_data.py — entirely synthetic, see that
# file's header) into that same database. Idempotent: checks for its own
# sample AMCs first, so re-running is a no-op unless --reset is passed
# manually via a local run.

on:
  workflow_dispatch:
    inputs:
      reset:
        description: "Remove previously seeded sample rows instead of (re-)seeding them"
        type: boolean
        default: false

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check DATABASE_URL is configured
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "::error::DATABASE_URL repository secret is not set. See docs/deployment.md."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Seed sample data
        if: ${{ inputs.reset != true }}
        run: python database/seeds/seed_sample_data.py

      - name: Reset (remove) sample data
        if: ${{ inputs.reset == true }}
        run: python database/seeds/seed_sample_data.py --reset

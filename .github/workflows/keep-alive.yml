name: Backend Keep-Alive

# Render's free tier spins a web service down after a period of
# inactivity; the next real visitor then pays for a slow "cold start"
# (tens of seconds) before the site responds at all. A tiny periodic ping
# to the health endpoint keeps the service warm so nobody sees that delay.
# This is purely a keep-alive — /api/health does a lightweight DB
# connectivity check and nothing else, no meaningful load added.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        # A Render free-tier cold start can take well over 30s from a full
        # stop (confirmed live: 3 consecutive runs each timed out at exactly
        # 30s with 0 bytes back, while a manual check moments later got a
        # normal, healthy response) — 30s was simply too short a leash for
        # the one case this ping exists to handle. This still comfortably
        # fits inside the 10-minute schedule interval.
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 90 \
            "https://thinkfin-backend.onrender.com/api/health"
